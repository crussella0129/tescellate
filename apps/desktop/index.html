<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Strict CSP is for production; in dev, Vite's HMR client needs
         WebSocket + inline script support which a tight CSP blocks.
         Re-tightened for the packaged build in Phase 4+. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' 'unsafe-eval' ws: http: data: blob:;" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tescellate</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
