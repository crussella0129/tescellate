[package]
name = "tescellate-ui"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Tescellate's pure-Rust front-end — an egui/eframe app, native and WebAssembly."

# Its own workspace root: the heavy egui/winit dependency tree is kept out
# of the engine workspace so `cargo build --workspace` there stays lean.
[workspace]

[dependencies]
eframe = "0.29"
egui = "0.29"
tescellate-core = { path = "../../crates/tescellate-core" }
tescellate-tess = { path = "../../crates/tescellate-tess" }
tescellate-formula = { path = "../../crates/tescellate-formula" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = 2
