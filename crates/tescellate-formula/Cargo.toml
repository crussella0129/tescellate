[package]
name = "tescellate-formula"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Formula engines for Tescellate: Excel-lite (built-in), Python (PyO3), Rhai, and native Rust (rustc + libloading)."

[features]
# All engines off by default in Phase 0 — only the trait + ExcelLite scaffold
# compile. Real impls land behind these flags.
default = []
# Python formula engine — embedded CPython via PyO3.
python = ["dep:pyo3"]
rhai = []
rustnative = []
# Native compile tier — transpiles Carbide to a cdylib and loads it.
# Needs `libloading` and a `cargo` toolchain available at runtime.
native = ["dep:libloading"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tescellate-core = { workspace = true }
tescellate-tess = { workspace = true }
tescellate-store = { workspace = true }
hashbrown = { workspace = true }
libloading = { version = "0.8", optional = true }
pyo3 = { version = "0.23", features = ["auto-initialize"], optional = true }

# Compiled-vs-interpreted benchmark; needs the native compile pipeline.
[[example]]
name = "native_bench"
required-features = ["native"]
