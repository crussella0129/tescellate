[package]
name = "tescellate-formula"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Formula engines for Tescellate: Excel-lite (built-in), Python (PyO3), Rhai, and native Rust (rustc + libloading)."

[features]
# All engines off by default in Phase 0 — only the trait + ExcelLite scaffold
# compile. Real impls land behind these flags.
default = []
python = []
rhai = []
rustnative = []

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tescellate-core = { workspace = true }
tescellate-tess = { workspace = true }
tescellate-store = { workspace = true }
hashbrown = { workspace = true }
